<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ImSorry</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This 404.html catches deep links (e.g. /full-letter) that GitHub Pages
      // can't resolve directly, and redirects to index.html with the real
      // path stashed in sessionStorage so index.html can restore it.
      var pathSegmentsToKeep = 1; // 1 = project page (username.github.io/repo/...)

      var l = window.location;
      sessionStorage.redirect = l.href;
      var segments = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        segments + "/?/" +
        l.pathname.slice(segments.length).replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
